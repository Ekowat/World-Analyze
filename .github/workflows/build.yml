name: Build World Analysis Android ARM64

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Android NDK r28c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build World Analysis for Android ARM64
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target WorldAnalysis --parallel 2

      - name: Verify outputs
        run: |
          test -f build/libWorldAnalysis.so
          test -f build/WorldAnalysis.levipack
          file build/libWorldAnalysis.so
          unzip -l build/WorldAnalysis.levipack

      - name: Upload World Analysis build
        uses: actions/upload-artifact@v4
        with:
          name: World-Analysis-Android-arm64
          path: |
            build/libWorldAnalysis.so
            build/WorldAnalysis.levipack
          if-no-files-found: error
